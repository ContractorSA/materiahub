<!doctype html>
<html lang="el">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Katerina Stamataki — CEO at Materia Hub"
  >


  <!-- =====================================================
       SOCIAL / SMS / WHATSAPP LINK PREVIEW
       TEMPORARY VERCEL URL
       ===================================================== -->

  <meta property="og:type" content="website">

  <meta
    property="og:title"
    content="Katerina Stamataki | Materia Hub"
  >

  <meta
    property="og:description"
    content="CEO"
  >

  <meta
    property="og:url"
    content="https://materiahub.vercel.app/card/katerina.html"
  >

  <meta
    property="og:image"
    content="https://materiahub.vercel.app/images/materiahublogo1.png"
  >

  <meta
    property="og:image:alt"
    content="Katerina Stamataki"
  >

  <meta name="twitter:card" content="summary_large_image">

  <meta
    name="twitter:title"
    content="Katerina Stamataki | Materia Hub"
  >

  <meta
    name="twitter:description"
    content="CEO"
  >

  <meta
    name="twitter:image"
    content="https://materiahub.vercel.app/images/materiahublogo1.png"
  >


  <title>Katerina Stamataki | Materia Hub</title>


  <!-- =====================================================
       IMAGE PRELOAD
       Ξεκινάνε να φορτώνουν αμέσως
       ===================================================== -->

  <link
    rel="preload"
    as="image"
    href="/images/materiahublogo1.png"
  >

  <link
    rel="preload"
    as="image"
    href="/images/katerina.webp"
  >

  <link
    rel="preload"
    as="image"
    href="/images/materiahublogo1.png"
  >


  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="card.css"
  >

  <style>
    .secondary-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  </style>


  <!-- JS -->

  <script
    defer
    src="katerina.js"
  ></script>

</head>


<body>

  <main class="card-page">

    <article
      class="business-card"
      aria-label="Ψηφιακή επαγγελματική κάρτα Katerina Stamataki"
    >


      <!-- ==================================================
           COVER + PROFILE
           ================================================== -->

      <section class="cover-area">


        <!-- COVER PHOTO -->

        <img
          id="coverPhoto"
          class="cover-photo"
          src="/images/architect.webp"
          alt=""
          aria-hidden="true"
          fetchpriority="high"
          decoding="async"
        >


        <div
          class="cover-overlay"
          aria-hidden="true"
        ></div>



        <!-- ==================================================
             MATERIA HUB LOGO
             ================================================== -->

        <div class="cover-logo-wrap">

          <img
            class="cover-logo"
            src="/images/materiahublogo1.png"
            alt="Materia Hub"
            decoding="async"
          >

        </div>



        <!-- ==================================================
             KATERINA PHOTO
             ================================================== -->

        <div class="profile-frame">

          <img
            id="profilePhoto"
            class="profile-photo"
            src="/images/katerina.webp"
            alt="Katerina Stamataki"
            fetchpriority="high"
            decoding="async"
          >

          <div
            class="profile-fallback"
            aria-hidden="true"
          >
            KS
          </div>

        </div>

      </section>



      <!-- ==================================================
           NAME / ROLE
           ================================================== -->

      <header class="identity">

        <h1 id="cardName">
          Katerina Stamataki
        </h1>

        <p id="cardRole">
          CEO
        </p>

      </header>



      <!-- ==================================================
           6 MAIN ACTIONS
           ================================================== -->

      <nav
        class="action-grid"
        aria-label="Στοιχεία επικοινωνίας"
      >


        <!-- PHONE -->

        <a
          class="action-item"
          id="callAction"
          href="tel:+306907507100"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M22 16.9v3a2 2 0 0 1-2.18 2
                19.8 19.8 0 0 1-8.63-3.07
                19.45 19.45 0 0 1-6-6
                A19.8 19.8 0 0 1 2.12 4.18
                2 2 0 0 1 4.11 2h3
                a2 2 0 0 1 2 1.72
                c.13.96.36 1.9.68 2.8
                a2 2 0 0 1-.45 2.11
                L8.07 9.9
                a16 16 0 0 0 6 6
                l1.27-1.27
                a2 2 0 0 1 2.11-.45
                c.9.32 1.84.55 2.8.68
                A2 2 0 0 1 22 16.9Z"
              />

            </svg>

          </span>

          <span class="action-label">
            Τηλέφωνο
          </span>

        </a>



        <!-- SMS -->

        <a
          class="action-item"
          id="smsAction"
          href="sms:+306907507100"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M5 5h14a2 2 0 0 1 2 2v8
                a2 2 0 0 1-2 2h-8l-5 3v-3H5
                a2 2 0 0 1-2-2V7
                a2 2 0 0 1 2-2Z"
              />

            </svg>

            <small class="inside-text">
              SMS
            </small>

          </span>

          <span class="action-label">
            SMS
          </span>

        </a>



        <!-- WHATSAPP -->

        <a
          class="action-item"
          id="whatsappAction"
          href="https://wa.me/306907507100"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M20.5 11.7
                a8.5 8.5 0 0 1-12.7 7.4
                L3 20.5
                l1.5-4.6
                a8.5 8.5 0 1 1 16-4.2Z"
              />

              <path
                d="M8.4 8.1
                c.4 3.1 2.6 5.4 5.7 5.8"
              />

            </svg>

          </span>

          <span class="action-label">
            WhatsApp
          </span>

        </a>



        <!-- ADD CONTACT -->

        <a
          class="action-item"
          id="saveAction"
          href="katerina.vcf"
          type="text/vcard"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <rect
                x="4"
                y="5"
                width="16"
                height="14"
                rx="1"
              />

              <circle
                cx="9"
                cy="10"
                r="2"
              />

              <path
                d="M6.5 16
                c.5-2 1.4-3 2.5-3
                s2 .9 2.5 3"
              />

              <path
                d="M14 9h4M14 12h4"
              />

            </svg>

          </span>

          <span class="action-label">
            Add
          </span>

        </a>



        <!-- EMAIL -->

        <a
          class="action-item"
          id="emailAction"
          href="mailto:info@materiahub.gr"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="1"
              />

              <path
                d="m4 7 8 6 8-6"
              />

            </svg>

          </span>

          <span class="action-label">
            Email
          </span>

        </a>



        <!-- SHARE -->

        <button
          class="action-item"
          id="shareAction"
          type="button"
        >

          <span class="action-circle">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M14 5h5v5"
              />

              <path
                d="m19 5-8 8"
              />

              <path
                d="M17 13v5
                a2 2 0 0 1-2 2H6
                a2 2 0 0 1-2-2V9
                a2 2 0 0 1 2-2h5"
              />

            </svg>

          </span>

          <span class="action-label">
            Share
          </span>

        </button>

      </nav>



      <!-- ==================================================
           SECONDARY LINKS
           ================================================== -->

      <section class="secondary-links">


        <!-- OFFICE -->

        <a
          class="secondary-link"
          id="officeAction"
          href="tel:+302106232650"
        >

          <small>
            OFFICE
          </small>

          <strong id="landlineLabel">
            +30 210 6232 650 
          </strong>

        </a>



        <!-- WEBSITE -->

        <a
          class="secondary-link"
          id="websiteAction"
          href="https://www.materiahub.gr/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <small>
            WEBSITE
          </small>

          <strong>
            materiahub.gr
          </strong>

        </a>
</section>



   

    </article>

  </main>



  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


</body>
</html>
